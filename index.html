<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>製程健康危害與金屬加工｜隨機測驗</title>
<style>
:root{--ink:#172033;--muted:#687386;--line:#e4e9f1;--primary:#3157c8;--primary2:#2345a8;--bg:#f4f6fb;--green:#16834b;--green-bg:#e8f7ef;--red:#c83232;--red-bg:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}
header{background:linear-gradient(120deg,#182b57,#3157c8);color:white;padding:30px 18px 26px}
.header-inner{max-width:980px;margin:auto}h1{font-size:clamp(22px,4vw,30px);margin:0 0 6px}header p{margin:0;color:#dce5ff}
main{max-width:980px;margin:22px auto;padding:0 14px 48px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 18px #23345b0a;margin-bottom:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar .spacer{flex:1}
button{border:0;border-radius:10px;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--primary);color:white}.primary:hover{background:var(--primary2)}.secondary{background:#edf1fa;color:#263b76}.danger{background:#fff0f0;color:#a92727}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#f7f8fc;border-radius:12px;padding:12px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:21px}
.progressline{height:8px;background:#edf0f6;border-radius:20px;overflow:hidden;margin:12px 0 5px}.progressline span{display:block;height:100%;background:var(--primary);width:0;transition:width .2s}
.question{padding:19px 0;border-bottom:1px solid var(--line)}.question:last-child{border-bottom:0}.qtop{display:flex;gap:10px;align-items:flex-start}.qnum{flex:none;background:#edf1ff;color:#2949aa;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:800}.qtext{font-weight:700;white-space:pre-wrap}.options{display:grid;gap:8px;margin:14px 0 0 42px}
.option{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;background:#fafbfe;border:1px solid #e4e8f0;color:var(--ink);padding:11px 13px;font-weight:500;border-radius:10px}
.option:hover:not(:disabled){border-color:#8da3e8;background:#f3f6ff}.letter{font-weight:800;color:#40527d;min-width:22px}.option.selected{border:2px solid var(--primary);background:#eef2ff;padding:10px 12px}
.option.correct{border:2px solid var(--green);background:var(--green-bg);color:#12653c;padding:10px 12px}.option.correct .letter{color:var(--green)}
.option.wrong{border:2px solid var(--red);background:var(--red-bg);color:#a52222;padding:10px 12px}.option.wrong .letter{color:var(--red)}
.feedback{font-size:13px;font-weight:800;margin-left:auto;white-space:nowrap}.result-summary{display:none}.result-summary.show{display:block}
.score{font-size:36px;font-weight:850;color:var(--primary)}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.dot.red{background:var(--red)}.dot.green{background:var(--green)}
#quizArea{display:none}#quizArea.show{display:block}.muted{color:var(--muted);font-size:14px}.empty{padding:22px;text-align:center;color:var(--muted)}
@media(max-width:600px){header{padding:24px 16px}.panel{padding:15px}.options{margin-left:0}.statgrid{gap:7px}.stat{padding:9px}.stat strong{font-size:18px}.toolbar button{flex:1}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>製程健康危害與金屬加工安全衛生</h1><p>150 題題庫・每回合隨機抽取 50 題</p></div></header>
<main>
<section class="panel" id="startPanel">
  <div class="toolbar"><div><strong>隨機測驗</strong><div class="muted">每次從完整題庫隨機抽出 50 題，單回合不重複。</div></div><div class="spacer"></div><button class="primary" id="startBtn">開始抽題</button></div>
  <div class="statgrid"><div class="stat"><small>題庫總數</small><strong>150 題</strong></div><div class="stat"><small>每次抽題</small><strong>50 題</strong></div><div class="stat"><small>作答方式</small><strong>單選題</strong></div></div>
</section>
<section class="panel" id="quizArea">
  <div class="toolbar"><strong id="quizTitle">本回合測驗</strong><div class="spacer"></div><span class="muted" id="progressText">已作答 0 / 50</span></div>
  <div class="progressline"><span id="progressBar"></span></div>
  <div class="muted" id="remainingText">尚未作答 50 題</div>
  <div id="questionList"></div>
  <div class="toolbar" style="margin-top:18px"><span class="muted" id="submitHint">交卷後即可查看正確答案與錯題標示。</span><div class="spacer"></div><button class="primary" id="submitBtn">交卷並查看結果</button></div>
</section>
<section class="panel result-summary" id="resultPanel">
  <div class="toolbar"><strong>本回合測驗結果</strong><div class="spacer"></div><button class="primary" id="againBtn">重新隨機抽 50 題</button></div>
  <div class="statgrid">
    <div class="stat"><small>答對</small><strong id="correctCount">0</strong></div>
    <div class="stat"><small>答錯</small><strong id="wrongCount">0</strong></div>
    <div class="stat"><small>未作答</small><strong id="blankCount">0</strong></div>
  </div>
  <div style="margin-top:14px">正確率：<span class="score" id="score">0%</span></div>
  <div class="legend"><span><i class="dot red"></i>你的錯誤選項</span><span><i class="dot green"></i>正確答案</span></div>
</section>
</main>
<script>
const QUESTION_BANK = [{"number": 1, "question": "作業場所安全衛生危害的產生，主要來自物質(M)、設備(E)、環境(E)及下列何者(P)？", "options": [{"key": "A", "text": "政策 (Policy)"}, {"key": "B", "text": "人員 (People)"}, {"key": "C", "text": "流程 (Process)"}, {"key": "D", "text": "產品 (Product)"}], "answer": "B"}, {"number": 2, "question": "下列關於「安全危害」與「衛生危害」特性的描述，何者正確？", "options": [{"key": "A", "text": "安全危害通常為長期累積產生"}, {"key": "B", "text": "衛生危害絕對不會造成立即致死效應"}, {"key": "C", "text": "安全危害通常為立即產生之傷害"}, {"key": "D", "text": "衛生危害僅限於物理性因子"}], "answer": "C"}, {"number": 3, "question": "下列何者不屬於「安全危害」的範疇？", "options": [{"key": "A", "text": "切傷與割傷"}, {"key": "B", "text": "塵肺症與石綿肺"}, {"key": "C", "text": "電擊與感電"}, {"key": "D", "text": "墜落與陷入"}], "answer": "B"}, {"number": 4, "question": "暴露於高溫環境或紫外線等非游離輻射，長期可能導致白內障，這屬於哪一類危害？", "options": [{"key": "A", "text": "化學性危害"}, {"key": "B", "text": "物理性危害"}, {"key": "C", "text": "生物性危害"}, {"key": "D", "text": "人因性危害"}], "answer": "B"}, {"number": 5, "question": "潛水員或高山作業人員容易發生的潛水夫病或高山症，主要與下列何種物理因子有關？", "options": [{"key": "A", "text": "異常氣壓"}, {"key": "B", "text": "游離輻射"}, {"key": "C", "text": "噪音震動"}, {"key": "D", "text": "非游離輻射"}], "answer": "A"}, {"number": 6, "question": "下列何者屬於化學性危害引起的呼吸系統全身或局部效應？", "options": [{"key": "A", "text": "白指症"}, {"key": "B", "text": "職業性氣喘與石綿肺"}, {"key": "C", "text": "雷諾氏症"}, {"key": "D", "text": "斜方肌痛"}], "answer": "B"}, {"number": 7, "question": "若欲了解作業場所中使用之原物料及中間產物的健康危害與暴露途徑，最直接且完整的查詢工具為？", "options": [{"key": "A", "text": "勞動基準法"}, {"key": "B", "text": "安全資料表 (SDS)"}, {"key": "C", "text": "設備操作說明書"}, {"key": "D", "text": "工廠登記證"}], "answer": "B"}, {"number": 8, "question": "在常溫常壓下為液體或固體，經由揮發或昇華作用所產生之氣體分子（如有機溶劑蒸氣、汞蒸氣），稱之為？", "options": [{"key": "A", "text": "氣體 (Gas)"}, {"key": "B", "text": "蒸氣 (Vapor)"}, {"key": "C", "text": "粉塵 (Dust)"}, {"key": "D", "text": "燻煙 (Fume)"}], "answer": "B"}, {"number": 9, "question": "常溫常壓下為固體，經由鑽鑿、切割或研磨等物理作用所產生之固體微粒（如石材粉塵），稱之為？", "options": [{"key": "A", "text": "燻煙 (Fume)"}, {"key": "B", "text": "霧滴 (Mist)"}, {"key": "C", "text": "粉塵 (Dust)"}, {"key": "D", "text": "氣體 (Gas)"}], "answer": "C"}, {"number": 10, "question": "常溫常壓下為固體，經過高溫氧化等化學作用而在常溫凝結成微細之固體微粒（如電焊產生的金屬煙塵），稱之為？", "options": [{"key": "A", "text": "粉塵 (Dust)"}, {"key": "B", "text": "燻煙 (Fume)"}, {"key": "C", "text": "蒸氣 (Vapor)"}, {"key": "D", "text": "液滴 (Droplet)"}], "answer": "B"}, {"number": 11, "question": "下列何者不屬於「粒狀物」暴露的型態？", "options": [{"key": "A", "text": "霧滴 (Mist)"}, {"key": "B", "text": "燻煙 (Fume)"}, {"key": "C", "text": "有機溶劑蒸氣 (Vapor)"}, {"key": "D", "text": "粉塵 (Dust)"}], "answer": "C"}, {"number": 12, "question": "電鍍槽中因電解氣泡破裂而噴濺飛散至空氣中的微粒，屬於下列何種吸入暴露型態？", "options": [{"key": "A", "text": "霧滴或液滴 (Mist/Droplet)"}, {"key": "B", "text": "燻煙 (Fume)"}, {"key": "C", "text": "氣體 (Gas)"}, {"key": "D", "text": "粉塵 (Dust)"}], "answer": "A"}, {"number": 13, "question": "棉花工人肺、退伍軍人症以及SARS等職業病，主要是由何種危害因子所引發？", "options": [{"key": "A", "text": "化學性危害"}, {"key": "B", "text": "物理性危害"}, {"key": "C", "text": "生物性危害"}, {"key": "D", "text": "人因性危害"}], "answer": "C"}, {"number": 14, "question": "長期手持振動物體或工具，導致手指血管痙攣蒼白，稱為白指症（雷諾氏現象），這屬於哪類危害？", "options": [{"key": "A", "text": "物理性與人因性危害"}, {"key": "B", "text": "生物性危害"}, {"key": "C", "text": "社會心理危害"}, {"key": "D", "text": "化學性危害"}], "answer": "A"}, {"number": 15, "question": "下列何者不屬於人因工程常見的風險因子？", "options": [{"key": "A", "text": "重複性動作"}, {"key": "B", "text": "不當姿勢"}, {"key": "C", "text": "游離輻射暴露"}, {"key": "D", "text": "接觸壓力"}], "answer": "C"}, {"number": 16, "question": "工作檯高度設計時，對於「精密工作 (Precision Work)」的最佳工作面高度建議為？", "options": [{"key": "A", "text": "低於腰部5公分"}, {"key": "B", "text": "約在高於肘部 5 cm 左右"}, {"key": "C", "text": "位於膝蓋高度"}, {"key": "D", "text": "隨意調整即可"}], "answer": "B"}, {"number": 17, "question": "工作檯高度設計時，對於「重體力工作 (Heavy Work)」的最佳工作面高度建議為？", "options": [{"key": "A", "text": "位於肘部與腰部之間"}, {"key": "B", "text": "高於肩膀"}, {"key": "C", "text": "高於肘部10公分"}, {"key": "D", "text": "眼睛平視高度"}], "answer": "A"}, {"number": 18, "question": "為減少勞工在搬運與搬移推車時的人因性負擔，下列操作原則何者最佳？", "options": [{"key": "A", "text": "用拉的比用推的好"}, {"key": "B", "text": "用推的比用拉的好 (Push rather than pull)"}, {"key": "C", "text": "儘量彎腰抬舉"}, {"key": "D", "text": "增加單次搬運重量"}], "answer": "B"}, {"number": 19, "question": "顯微鏡操作員手臂長期壓迫在桌緣導致不適，可採取下列何種改善措施以減輕接觸壓力？", "options": [{"key": "A", "text": "設置手臂支撐架 (Armrest)"}, {"key": "B", "text": "提高座椅高度"}, {"key": "C", "text": "增加照明強度"}, {"key": "D", "text": "佩戴耳塞"}], "answer": "A"}, {"number": 20, "question": "針對需要長時間站立的工作，下列何者能有效改善腿部與腰部舒適度？", "options": [{"key": "A", "text": "穿著高跟鞋"}, {"key": "B", "text": "使用腳踏板 (Footrest) 交替踩踏或坐站兩用倚"}, {"key": "C", "text": "保持雙腿打直不移動"}, {"key": "D", "text": "減少工作區照明"}], "answer": "B"}, {"number": 21, "question": "長期姿勢不良、過度伸展及抬舉重物，容易在手肘外側引發俗稱「網球肘」的疾病，其醫學名稱為？", "options": [{"key": "A", "text": "腕道症候群"}, {"key": "B", "text": "外側肱上髁炎"}, {"key": "C", "text": "肌筋膜疼痛症候群"}, {"key": "D", "text": "扳機指"}], "answer": "B"}, {"number": 22, "question": "長期跪姿或蹲姿作業（如地板鋪設工人）容易引發膝前滑液囊炎，俗稱為？", "options": [{"key": "A", "text": "女傭膝 (Housemaid's knee)"}, {"key": "B", "text": "網球肘"}, {"key": "C", "text": "雷諾氏症"}, {"key": "D", "text": "跳躍膝"}], "answer": "A"}, {"number": 23, "question": "氣泡在液體表面破裂釋放霧滴時，主要包含「薄膜液滴」與下列何者？", "options": [{"key": "A", "text": "噴流液滴 (Jet drops)"}, {"key": "B", "text": "昇華蒸氣"}, {"key": "C", "text": "凝聚燻煙"}, {"key": "D", "text": "沉降粉塵"}], "answer": "A"}, {"number": 24, "question": "為預防久站或搬運引發的下背痛，工廠應將重型物體優先儲存於何種高度範圍？", "options": [{"key": "A", "text": "儘量貼近地面"}, {"key": "B", "text": "儘量接近腰部或髖部高度 (Waist or hip level)"}, {"key": "C", "text": "高於肩膀的位置"}, {"key": "D", "text": "離地2公尺以上高架"}], "answer": "B"}, {"number": 25, "question": "下列何者屬於社會心理性危害可能造成的影響？", "options": [{"key": "A", "text": "聽力受損"}, {"key": "B", "text": "工作壓力、焦慮與職業倦怠"}, {"key": "C", "text": "矽肺症"}, {"key": "D", "text": "電光性眼炎"}], "answer": "B"}, {"number": 26, "question": "噴砂 (Abrasive blasting) 作業的主要目的不包括下列何者？", "options": [{"key": "A", "text": "清除金屬表面之鏽蝕與舊塗層"}, {"key": "B", "text": "增加表面粗糙度以利塗料咬合"}, {"key": "C", "text": "進行玻璃或石材之雕刻與磨砂"}, {"key": "D", "text": "使金屬表面產生鍍層反應"}], "answer": "D"}, {"number": 27, "question": "噴砂作業中常用的礦物類磨料，且最容易引發「矽肺症」的原料是？", "options": [{"key": "A", "text": "鋼丸"}, {"key": "B", "text": "矽砂 (Silica sand)"}, {"key": "C", "text": "玻璃珠"}, {"key": "D", "text": "核桃殼"}], "answer": "B"}, {"number": 28, "question": "噴砂櫃 (Sandblast cabinet) 常用的硬質磨料包含氧化鋁與下列何者？", "options": [{"key": "A", "text": "碳化矽 (Silicon carbide)"}, {"key": "B", "text": "麵粉"}, {"key": "C", "text": "石膏"}, {"key": "D", "text": "塑膠粒"}], "answer": "A"}, {"number": 29, "question": "壓送式「噴砂桶（壓力罐）」相較於一般吸入式噴砂箱，其打擊力與效率通常高出幾倍？", "options": [{"key": "A", "text": "0.5倍"}, {"key": "B", "text": "3~5 倍"}, {"key": "C", "text": "20~30倍"}, {"key": "D", "text": "完全一樣"}], "answer": "B"}, {"number": 30, "question": "戶外開放式噴砂作業時，作業人員預防粉塵吸入最有效的個人防護具 (PPE) 為？", "options": [{"key": "A", "text": "一般外科口罩"}, {"key": "B", "text": "活性碳口罩"}, {"key": "C", "text": "送氣式噴砂頭帽 (Supplied-air helmet)"}, {"key": "D", "text": "防塵防護面罩"}], "answer": "C"}, {"number": 31, "question": "若噴砂物件原有的舊塗層含有鉛、鉻、鎘等重金屬，噴砂時易引發何種健康危害？", "options": [{"key": "A", "text": "重金屬中毒與塵肺症"}, {"key": "B", "text": "熱中暑"}, {"key": "C", "text": "減壓病"}, {"key": "D", "text": "白內障"}], "answer": "A"}, {"number": 32, "question": "在密閉空間進行活性金屬（如鋁粉、鎂粉）噴砂時，若粉塵濃度過高遇靜電火花，極易引發？", "options": [{"key": "A", "text": "粉塵爆炸"}, {"key": "B", "text": "水蒸氣爆炸"}, {"key": "C", "text": "氰化物中毒"}, {"key": "D", "text": "減壓症"}], "answer": "A"}, {"number": 33, "question": "長期從事噴砂作業且未佩戴合適防護具，吸入高濃度結晶型游離二氧化矽，易罹患何種法定職業病？", "options": [{"key": "A", "text": "矽肺症 (Silicosis)"}, {"key": "B", "text": "棉塵症"}, {"key": "C", "text": "鎘黃病"}, {"key": "D", "text": "減壓症"}], "answer": "A"}, {"number": 34, "question": "工業「脫脂 (Degreasing)」的主要目的是去除金屬表面的何種物質？", "options": [{"key": "A", "text": "氧化鐵鏽皮"}, {"key": "B", "text": "油脂、蠟質與有機污染物"}, {"key": "C", "text": "電鍍層"}, {"key": "D", "text": "游離二氧化矽"}], "answer": "B"}, {"number": 35, "question": "金屬若未徹底脫脂即進行後續噴漆或電鍍，容易造成何種不良結果？", "options": [{"key": "A", "text": "漆膜剝落與電鍍不均勻"}, {"key": "B", "text": "金屬熔化"}, {"key": "C", "text": "表面晶格變形"}, {"key": "D", "text": "產生游離輻射"}], "answer": "A"}, {"number": 36, "question": "傳統蒸氣脫脂槽常用的有機溶劑（如三氯乙烯 TCE），已被國際癌症研究機構 (IARC) 列為致癌物，長期暴露易增加何種癌症風險？", "options": [{"key": "A", "text": "腎臟癌與肝癌"}, {"key": "B", "text": "骨肉瘤"}, {"key": "C", "text": "視網膜癌"}, {"key": "D", "text": "胃潰瘍"}], "answer": "A"}, {"number": 37, "question": "長期暴露於脫脂溶劑 1-溴丙烷 (1-BP) 或正己烷 (n-Hexane)，最典型的職業神經毒性症狀為？", "options": [{"key": "A", "text": "周邊神經病變（手腳麻木、肌肉萎縮）"}, {"key": "B", "text": "聽力喪失"}, {"key": "C", "text": "網膜剝離"}, {"key": "D", "text": "痛風"}], "answer": "A"}, {"number": 38, "question": "台灣著名的「RCA桃園設廠工傷案」，主要是因為廠內長年使用何種有毒有機溶劑脫脂造成員工大量罹癌？", "options": [{"key": "A", "text": "三氯乙烯與四氯乙烯"}, {"key": "B", "text": "正己烷"}, {"key": "C", "text": "丙酮"}, {"key": "D", "text": "乙醇"}], "answer": "A"}, {"number": 39, "question": "鹼洗 (Alkaline cleaning) 去除金屬表面油脂的主要理化機制為？", "options": [{"key": "A", "text": "氧化還原反應"}, {"key": "B", "text": "乳化作用與皂化作用 (Emulsification/Saponification)"}, {"key": "C", "text": "昇華作用"}, {"key": "D", "text": "物理磨削"}], "answer": "B"}, {"number": 40, "question": "酸洗 (Acid pickling) 的主要目的為去除金屬表面的？", "options": [{"key": "A", "text": "切削油與油脂"}, {"key": "B", "text": "鐵鏽（氧化鐵）與高溫氧化皮"}, {"key": "C", "text": "殘留蠟質"}, {"key": "D", "text": "塗料"}], "answer": "B"}, {"number": 41, "question": "酸洗製程中最常用來溶解鋼鐵表面氧化皮的強酸不包括下列何者？", "options": [{"key": "A", "text": "鹽酸 (HCl)"}, {"key": "B", "text": "硫酸 (H2SO4)"}, {"key": "C", "text": "氫氟酸 (HF)"}, {"key": "D", "text": "檸檬汁"}], "answer": "D"}, {"number": 42, "question": "強酸（如濃鹽酸、硫酸）或強鹼（如氫氧化鈉）濺觸人體皮膚或眼睛時，最主要的立即安全危害為？", "options": [{"key": "A", "text": "化學性灼傷 (Chemical burns)"}, {"key": "B", "text": "輻射傷害"}, {"key": "C", "text": "感電休克"}, {"key": "D", "text": "白指症"}], "answer": "A"}, {"number": 43, "question": "金屬酸洗過程中，酸液與金屬反應會在槽內產生何種易燃易爆的氣體？", "options": [{"key": "A", "text": "氧氣"}, {"key": "B", "text": "氫氣 (H2)"}, {"key": "C", "text": "二氧化碳"}, {"key": "D", "text": "氮氣"}], "answer": "B"}, {"number": 44, "question": "使用硝酸進行金屬酸洗時，反應過程中會逸散出何種劇毒紅棕色氣體？", "options": [{"key": "A", "text": "氮氧化物 (NOx)"}, {"key": "B", "text": "氯氣"}, {"key": "C", "text": "甲烷"}, {"key": "D", "text": "氫氣"}], "answer": "A"}, {"number": 45, "question": "金屬精煉或酸洗含砷雜質的金屬時，若產生無色極毒的「砷化氫 (AsH3)」氣體，吸入後會導致？", "options": [{"key": "A", "text": "嚴重溶血與肝腎損傷"}, {"key": "B", "text": "骨骼鈣化"}, {"key": "C", "text": "皮膚色素沈著"}, {"key": "D", "text": "聽力提高"}], "answer": "A"}, {"number": 46, "question": "勞工在熱酸洗槽（如70°C）旁作業時，若未設置安全防護欄杆，最易發生何種重大職災？", "options": [{"key": "A", "text": "跌落高溫酸槽導致嚴重化學與熱灼傷"}, {"key": "B", "text": "高空墜落死亡"}, {"key": "C", "text": "研磨輪破裂擊傷"}, {"key": "D", "text": "聲帶受損"}], "answer": "A"}, {"number": 47, "question": "下列關於「研磨 (Grinding)」、「拋光 (Polishing)」與「擦光 (Buffing)」的比較，何者正確？", "options": [{"key": "A", "text": "研磨屬於粗加工去除大面積毛邊，擦光為最終極致鏡面光澤精修"}, {"key": "B", "text": "拋光切削力最大"}, {"key": "C", "text": "擦光使用最粗的砂輪片"}, {"key": "D", "text": "三者完全沒有差異"}], "answer": "A"}, {"number": 48, "question": "平面研磨或濕式研磨時常用的冷卻切削液，若含有殺菌劑或亞硝酸鹽，長期接觸皮膚易引發？", "options": [{"key": "A", "text": "接觸性皮膚炎"}, {"key": "B", "text": "白指症"}, {"key": "C", "text": "減壓病"}, {"key": "D", "text": "痛風"}], "answer": "A"}, {"number": 49, "question": "拋光與擦光作業中，金屬細微粉塵若與拋光輪脫落的棉絮纖維混合積聚於集塵管道，遇到火花極易引發？", "options": [{"key": "A", "text": "管道粉塵爆炸與火災"}, {"key": "B", "text": "氰化物中毒"}, {"key": "C", "text": "砷化氫中毒"}, {"key": "D", "text": "水蒸氣爆炸"}], "answer": "A"}, {"number": 50, "question": "操作砂輪機或研磨機時，若未安裝防護罩或砂輪片轉速超限，最嚴重的機械安全危害為？", "options": [{"key": "A", "text": "砂輪片破裂高速飛散擊傷頭面部"}, {"key": "B", "text": "電光性眼炎"}, {"key": "C", "text": "聽力損失"}, {"key": "D", "text": "腸胃不適"}], "answer": "A"}, {"number": 51, "question": "手提研磨機切割金屬時，若機具絕緣不良且未裝設漏電斷路器，易引發？", "options": [{"key": "A", "text": "感電休克死亡"}, {"key": "B", "text": "石綿肺"}, {"key": "C", "text": "熱中暑"}, {"key": "D", "text": "減壓症"}], "answer": "A"}, {"number": 52, "question": "長時間手持重達2公斤之電動研磨機進行重複性動作，手部肌腱發炎鎖死，稱為？", "options": [{"key": "A", "text": "扳機指 (Trigger finger)"}, {"key": "B", "text": "女傭膝"}, {"key": "C", "text": "塵肺症"}, {"key": "D", "text": "電焊眼"}], "answer": "A"}, {"number": 53, "question": "陶瓷廠作業員長期使用砂紙拋光陶瓷，暴露於高濃度二氧化矽粉塵，易罹患？", "options": [{"key": "A", "text": "塵肺症 (矽肺)"}, {"key": "B", "text": "巴金森氏症"}, {"key": "C", "text": "錳中毒"}, {"key": "D", "text": "聽力損失"}], "answer": "A"}, {"number": 54, "question": "早期金屬拋光工人若使用含有「石綿」成分的磨砂輪且未防護，長期暴露可能引發？", "options": [{"key": "A", "text": "肺癌或石綿肺"}, {"key": "B", "text": "減壓病"}, {"key": "C", "text": "網球肘"}, {"key": "D", "text": "登革熱"}], "answer": "A"}, {"number": 55, "question": "電解脫脂 (Electrolytic cleaning) 過程中，待清洗工件連接於陰極，溶液中主要產生的氣泡為？", "options": [{"key": "A", "text": "氫氣 (H2)"}, {"key": "B", "text": "氧氣 (O2)"}, {"key": "C", "text": "氯氣"}, {"key": "D", "text": "二氧化硫"}], "answer": "A"}, {"number": 56, "question": "傳統蒸氣脫脂槽（Vapor-phase degreaser）內部設有冷卻線圈 (Cooling coils)，其主要功能為？", "options": [{"key": "A", "text": "冷凝溶劑蒸氣，防止蒸氣逸散至車間"}, {"key": "B", "text": "加熱溶劑"}, {"key": "C", "text": "攪拌液體"}, {"key": "D", "text": "過濾鐵屑"}], "answer": "A"}, {"number": 57, "question": "超音波脫脂槽 (Ultrasonic degreaser) 是利用何種組件將電能轉化為高頻機械振動？", "options": [{"key": "A", "text": "轉換器/超音波換能器 (Transducers)"}, {"key": "B", "text": "加熱管"}, {"key": "C", "text": "冷凝管"}, {"key": "D", "text": "水分離器"}], "answer": "A"}, {"number": 58, "question": "金屬乾式噴砂機作業時，為防止靜電積聚引發火花，設備應具備何種安全措施？", "options": [{"key": "A", "text": "良好接地系統 (Grounding)"}, {"key": "B", "text": "增加噴砂壓力"}, {"key": "C", "text": "使用塑膠噴嘴"}, {"key": "D", "text": "關閉通風"}], "answer": "A"}, {"number": 59, "question": "噴砂槍噴嘴常用的耐磨耐高溫材質包括鎠鋼以及下列何者？", "options": [{"key": "A", "text": "碳化硼 (Boron carbide)"}, {"key": "B", "text": "軟木"}, {"key": "C", "text": "鋁合金"}, {"key": "D", "text": "橡膠"}], "answer": "A"}, {"number": 60, "question": "研磨作業時噴射出的金屬碎屑與磨粒飛散物，對操作者最直接的急性傷害部位為？", "options": [{"key": "A", "text": "眼睛與皮膚"}, {"key": "B", "text": "腳趾"}, {"key": "C", "text": "耳膜內部"}, {"key": "D", "text": "牙齒"}], "answer": "A"}, {"number": 61, "question": "將金屬加熱變軟後，透過強力敲打或壓製，使其改變形狀並使內部結構密合堅固的技術稱為？", "options": [{"key": const LETTERS = ["A","B","C","D"];
let currentQuestions = [];
let userAnswers = {};
let submitted = false;

const $ = id => document.getElementById(id);
function shuffle(array){
  const a=[...array];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function startQuiz(){
  currentQuestions=shuffle(QUESTION_BANK).slice(0,50);
  userAnswers={}; submitted=false;
  $("resultPanel").classList.remove("show");
  $("quizArea").classList.add("show");
  $("questionList").innerHTML="";
  currentQuestions.forEach((q,index)=>{
    const section=document.createElement("section");section.className="question";section.id=`question-${index}`;
    const top=document.createElement("div");top.className="qtop";
    const num=document.createElement("span");num.className="qnum";num.textContent=`第 ${index+1} 題`;
    const text=document.createElement("div");text.className="qtext";text.textContent=q.question;
    top.append(num,text);section.append(top);
    const opts=document.createElement("div");opts.className="options";
    q.options.forEach(opt=>{
      const btn=document.createElement("button");btn.type="button";btn.className="option";
      btn.dataset.key=opt.key;btn.setAttribute("aria-pressed","false");
      const letter=document.createElement("span");letter.className="letter";letter.textContent=opt.key+".";
      const body=document.createElement("span");body.textContent=opt.text;
      btn.append(letter,body);
      btn.addEventListener("click",()=>chooseAnswer(index,opt.key));
      opts.append(btn);
    });
    section.append(opts);$("questionList").append(section);
  });
  $("submitBtn").disabled=false;$("submitHint").textContent="交卷後即可查看正確答案與錯題標示。";
  updateProgress();window.scrollTo({top:0,behavior:"smooth"});
}
function chooseAnswer(index,key){
  if(submitted)return;
  userAnswers[index]=key;
  const section=$(`question-${index}`);
  section.querySelectorAll(".option").forEach(btn=>{
    const selected=btn.dataset.key===key;
    btn.classList.toggle("selected",selected);
    btn.setAttribute("aria-pressed",String(selected));
  });
  updateProgress();
}
function updateProgress(){
  const done=Object.keys(userAnswers).length;
  $("progressText").textContent=`已作答 ${done} / 50`;
  $("remainingText").textContent=`尚未作答 ${50-done} 題`;
  $("progressBar").style.width=`${done/50*100}%`;
}
function submitQuiz(){
  if(submitted)return;
  const blank=50-Object.keys(userAnswers).length;
  if(blank>0 && !confirm(`還有 ${blank} 題尚未作答，確定要交卷嗎？`))return;
  submitted=true;
  let correct=0,wrong=0;
  currentQuestions.forEach((q,index)=>{
    const selected=userAnswers[index];
    if(selected===q.answer)correct++;else wrong++;
    const section=$(`question-${index}`);
    section.querySelectorAll(".option").forEach(btn=>{
      btn.disabled=true;
      const key=btn.dataset.key;
      if(key===q.answer){
        btn.classList.remove("selected");btn.classList.add("correct");
        const tag=document.createElement("span");tag.className="feedback";tag.textContent="正確答案";btn.append(tag);
      }else if(selected===key){
        btn.classList.remove("selected");btn.classList.add("wrong");
        const tag=document.createElement("span");tag.className="feedback";tag.textContent="你的選擇";btn.append(tag);
      }else{btn.classList.remove("selected");}
    });
  });
  const unanswered=blank;
  const percent=Math.round(correct/50*100);
  $("correctCount").textContent=correct;
  $("wrongCount").textContent=wrong-unanswered;
  $("blankCount").textContent=unanswered;
  $("score").textContent=percent+"%";
  $("resultPanel").classList.add("show");
  $("submitBtn").disabled=true;$("submitHint").textContent="已完成交卷；下方題目已標示正確答案與你的錯誤選項。";
  $("resultPanel").scrollIntoView({behavior:"smooth",block:"start"});
}
$("startBtn").addEventListener("click",startQuiz);
$("againBtn").addEventListener("click",startQuiz);
$("submitBtn").addEventListener("click",submitQuiz);
</script>
